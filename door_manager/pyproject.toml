tool.setuptools.py-modules = ["door_manager", "door_hal"]

[tool.uv]
default-groups = []

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "door-manager"
version = "1.1.0"
license = {text = "GPL-3.0"}
requires-python = ">=3.7"

dependencies = [
    "decorated-paho-mqtt==1.1.1",
    "docopt~=0.6.2",
    "paho-mqtt~=2.1.0",
    "parameterized>=0.9.0",
    "pyserial~=3.5",
    "pyudev~=0.24.3",
]

[project.scripts]
door-manager = "door_manager:main"

[dependency-groups]
rpi = [
    "rpi.gpio~=0.7.1",
]
